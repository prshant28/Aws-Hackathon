name: Deploy to AWS App Runner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY || 'recallx247' }}
  APP_RUNNER_SERVICE: ${{ vars.AWS_APP_RUNNER_SERVICE || 'recallx247' }}
  IMAGE_TAG: latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy App Runner service
        env:
          APP_RUNNER_ACCESS_ROLE_ARN: ${{ secrets.AWS_APP_RUNNER_ACCESS_ROLE_ARN }}
          APP_RUNNER_INSTANCE_ROLE_ARN: ${{ vars.AWS_APP_RUNNER_INSTANCE_ROLE_ARN || '' }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          OPENAI_API_KEY_SECRET_ARN: ${{ secrets.AWS_OPENAI_API_KEY_SECRET_ARN }}
          GEMINI_API_KEY_SECRET_ARN: ${{ secrets.AWS_GEMINI_API_KEY_SECRET_ARN }}
          SESSION_SECRET_SECRET_ARN: ${{ secrets.AWS_SESSION_SECRET_ARN }}
        run: bash scripts/deploy-aws-app-runner.sh
