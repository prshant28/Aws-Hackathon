<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- Preconnect to the auth + data hosts the app contacts on first paint
         so the TLS handshake overlaps with parsing rather than blocking it. -->
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.googleapis.com" />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <!-- Hero/splash logo. WebP is ~20× smaller than the original PNG. -->
    <link rel="preload" as="image" href="/x247-logo.webp" type="image/webp" fetchpriority="high" />
    <title>Recall X247 — Neural OS v2.0</title>
    <script>
      (function() {
        var t = localStorage.getItem('recall-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <style>
      html, body { margin: 0; padding: 0; background: #03080f; }
      #x247-splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 28px;
        background: #03080f;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #x247-splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
      #x247-splash img {
        width: clamp(140px, 18vw, 220px);
        height: auto;
        aspect-ratio: 785 / 421;
        opacity: 0;
        animation: x247-fadein 0.6s ease-out 0.05s forwards;
        user-select: none;
        -webkit-user-drag: none;
      }
      #x247-splash .x247-dots {
        display: flex; gap: 6px;
        opacity: 0;
        animation: x247-fadein 0.6s ease-out 0.25s forwards;
      }
      #x247-splash .x247-dots span {
        width: 5px; height: 5px; border-radius: 50%;
        background: rgba(255,255,255,0.42);
        animation: x247-bounce 1.1s ease-in-out infinite;
      }
      #x247-splash .x247-dots span:nth-child(2) { animation-delay: 0.15s; }
      #x247-splash .x247-dots span:nth-child(3) { animation-delay: 0.30s; }
      @keyframes x247-fadein {
        to { opacity: 1; }
      }
      @keyframes x247-bounce {
        0%, 80%, 100% { transform: scale(0.7); opacity: 0.35; }
        40%           { transform: scale(1);   opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #x247-splash img, #x247-splash .x247-dots, #x247-splash .x247-dots span {
          animation: none; opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="x247-splash" aria-hidden="true">
      <img
        src="/x247-logo.webp"
        alt="x247 AI"
        width="785"
        height="421"
        decoding="async"
        fetchpriority="high"
      />
      <div class="x247-dots"><span></span><span></span><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.hideSplash = function () {
        var s = document.getElementById('x247-splash');
        if (s && !s.classList.contains('hide')) {
          s.classList.add('hide');
          setTimeout(function () { s && s.parentNode && s.parentNode.removeChild(s); }, 500);
        }
      };
      // Absolute safety-net: hide after 8s no matter what
      setTimeout(window.hideSplash, 8000);
    </script>
  </body>
</html>
